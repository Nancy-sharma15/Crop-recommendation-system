  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Crop Advisor</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url("{{ url_for('static', filename='images/How is Corn Grown_ Essential Steps for a Healthy Crop.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      animation: fadeIn 3s ease-in-out;
    }

    /* Semi-transparent overlay for contrast */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1;
    }

    /* Welcome message box */
    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      animation: slideUp 1.5s ease-in-out;
    }

    h1 {
      font-size: 40px;
      margin: 0;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    }

    p {
      font-size: 18px;
      margin-top: 10px;
      opacity: 0.9;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <h1>Welcome to Smart Crop Advisor</h1>
    <p>Preparing your personalized experience...</p>
  </div>
</body>
</html>
