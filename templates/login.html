<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Crop Advisor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("{{ url_for('static', filename='images/How to Harvest Walla Walla Onions_ Essential Tips for Gardeners.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      position: relative;
      overflow: hidden;
      animation: fadeIn 1.2s ease-in-out;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.12);
      padding: 50px 60px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      color: white;
      text-align: center;
      width: 360px;
    }

    .card h2 {
      font-weight: 600;
      margin-bottom: 25px;
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
      letter-spacing: 1px;
      animation: slideUp 1s ease;
    }

    .card input {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: rgba(255, 255, 255, 0.85);
    }

    .card button {
      width: 100%;
      padding: 12px 0;
      background-color: #00a86b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      margin-left: 16px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .card button:hover {
      background-color: #00925f;
      transform: translateY(-2px);
    }

    .error {
      background: rgba(255, 0, 0, 0.2);
      color: #ffbaba;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .register-text {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.9;
    }

    .register-text a {
      color: #00ffb3;
      text-decoration: none;
      font-weight: 500;
    }

    .register-text a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      .card {
        width: 90%;
        padding: 40px 30px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="card">
    <h2>Login</h2>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p class="register-text">
      New user? <a href="/register">Register here</a>
    </p>
  </div>
</body>
</html>
